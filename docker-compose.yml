services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be a set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./sql:/docker-entrypoint-initdb.d:ro"
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    ports: 
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD must be a set}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set}
    volumes:
      - "keycloak_data:/opt/keycloak/data"
      - "./keycloak:/opt/keycloak/data/import:ro"
volumes:
  postgres_data: {}
  keycloak_data: {}